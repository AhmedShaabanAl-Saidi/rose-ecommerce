<div class="flex items-center gap-2">
  <button type="button" (click)="language.toggleLanguage()"
    class="inline-flex h-9 items-center justify-center gap-2 rounded-lg border border-zinc-200 bg-white px-2.5 text-xs font-semibold text-zinc-700 transition-colors hover:border-maroon-200 hover:bg-maroon-50 hover:text-maroon-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-maroon-500 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-100 dark:hover:border-soft-pink-300/50 dark:hover:bg-zinc-800 dark:hover:text-soft-pink-200 dark:focus-visible:ring-soft-pink-300"
    [class.w-9]="compact()" [class.px-0]="compact()" [attr.aria-label]="language.languageToggleAriaLabel()"
    [title]="language.languageToggleAriaLabel()">
    <lucide-icon [img]="icon.Languages" class="h-4 w-4"></lucide-icon>
    @if (!compact()) {
    <span class="hidden sm:inline">
      {{ language.languageToggleLabel() }}
    </span>
    }
  </button>

  <button type="button" (click)="theme.toggleTheme()"
    class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-zinc-200 bg-white text-zinc-700 transition-colors hover:border-maroon-200 hover:bg-maroon-50 hover:text-maroon-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-maroon-500 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-100 dark:hover:border-soft-pink-300/50 dark:hover:bg-zinc-800 dark:hover:text-soft-pink-200 dark:focus-visible:ring-soft-pink-300"
    [attr.aria-label]="theme.getToggleAriaLabel(language.currentLang())"
    [attr.aria-pressed]="theme.theme() === Theme.DARK" [title]="theme.getToggleAriaLabel(language.currentLang())">
    <lucide-icon [img]="theme.theme() === Theme.LIGHT ? icon.Moon : icon.Sun" class="h-4 w-4"></lucide-icon>
  </button>
</div>
