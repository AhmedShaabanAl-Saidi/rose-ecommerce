<nav [ngClass]="{
  'flex min-w-0 items-center gap-1 text-[10px] font-medium leading-4 text-zinc-500': variant() === 'mobile',
  'hidden lg:flex items-center gap-1 py-3 px-6 bg-white border-b border-zinc-100': variant() === 'desktop'
}" aria-label="Breadcrumb">
  <p-breadcrumb [model]="breadcrumbs()" [home]="variant() === 'desktop' ? homeItem : undefined" styleClass="!bg-transparent !border-0 !p-0">
    <ng-template #item let-item>
      @if (item.routerLink) {
      <a [routerLink]="item.routerLink"
        [ngClass]="variant() === 'mobile' ? 'min-w-0 max-w-20 truncate text-zinc-500 no-underline transition-colors hover:text-maroon-700 sm:max-w-28' : 'text-sm font-medium text-zinc-500 hover:text-maroon-700 transition-colors no-underline'">
        {{ item.label }}
      </a>
      } @else {
      <span [ngClass]="variant() === 'mobile' ? 'min-w-0 max-w-24 truncate font-semibold text-maroon-700 sm:max-w-32' : 'text-sm font-semibold text-maroon-700'">
        {{ item.label }}
      </span>
      }
    </ng-template>
    <ng-template #separator>
      <i class="pi pi-chevron-right text-zinc-300 mx-1" [ngClass]="variant() === 'mobile' ? 'text-[8px] shrink-0' : 'text-[10px]'"></i>
    </ng-template>
  </p-breadcrumb>
</nav>
