<nav
  [ngClass]="{
    'flex min-w-0 items-center gap-1 text-[10px] font-medium leading-4 text-zinc-500 dark:text-zinc-400': variant() === 'mobile',
    'hidden lg:flex items-center justify-between gap-4 py-3 px-6 bg-white border-b border-zinc-100 transition-colors dark:bg-zinc-950 dark:border-zinc-800': variant() === 'desktop'
  }"
  [attr.aria-label]="'DASHBOARD.BREADCRUMB.LABEL' | translate"
>
  <div class="min-w-0 flex-1">
    <p-breadcrumb
      [model]="breadcrumbs()"
      [home]="variant() === 'desktop' ? homeItem : undefined"
      styleClass="!bg-transparent !border-0 !p-0"
    >
      <ng-template #item let-item>
        @if (item.routerLink) {
        <a
          [routerLink]="item.routerLink"
          [ngClass]="
            variant() === 'mobile'
              ? 'min-w-0 max-w-20 truncate text-zinc-500 no-underline transition-colors hover:text-maroon-700 dark:text-zinc-400 dark:hover:text-soft-pink-200 sm:max-w-28'
              : 'text-sm font-medium text-zinc-500 hover:text-maroon-700 transition-colors no-underline dark:text-zinc-400 dark:hover:text-soft-pink-200'
          "
        >
          {{ item.label }}
        </a>
        } @else {
        <span
          [ngClass]="
            variant() === 'mobile'
              ? 'min-w-0 max-w-24 truncate font-semibold text-maroon-700 dark:text-soft-pink-200 sm:max-w-32'
              : 'text-sm font-semibold text-maroon-700 dark:text-soft-pink-200'
          "
        >
          {{ item.label }}
        </span>
        }
      </ng-template>
      <ng-template #separator>
        <i
          class="pi pi-chevron-right mx-1 text-zinc-300 dark:text-zinc-600 rtl:rotate-180"
          [ngClass]="
            variant() === 'mobile' ? 'text-[8px] shrink-0' : 'text-[10px]'
          "
        ></i>
      </ng-template>
    </p-breadcrumb>
  </div>

  @if (variant() === 'desktop') {
    <app-appearance-controls />
  }
</nav>
