<div
  [ngClass]="getCardClasses()"
  class="relative overflow-hidden rounded-2xl p-6 shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-md flex flex-col items-start justify-between min-h-[140px]"
>
  <div
    [ngClass]="getIconContainerClasses()"
    class="flex h-10 w-10 items-center justify-center rounded-xl transition-transform duration-300 group-hover:scale-110"
  >
    <i [class]="icon() + ' text-xl'"></i>
  </div>

  <div class="space-y-1 mt-4">
    <h3 [ngClass]="getTextClasses()" class="text-2xl font-bold lg:text-3xl">
      {{ formatValue(value()) }}
    </h3>
    <p class="text-sm font-medium text-zinc-600">
      {{ label() }}
    </p>
  </div>
</div>
