<div class="rounded-2xl border border-zinc-200/80 bg-white p-6 shadow-sm flex flex-col h-full">
  <div class="mb-5">
    <h3 class="text-lg font-bold text-zinc-800">Top Selling Products</h3>
  </div>

  <div class="flex-1 space-y-5">
    @if (productsList().length === 0) {
      <div class="flex h-32 flex-col items-center justify-center text-zinc-400">
        <i class="pi pi-box text-2xl mb-2"></i>
        <span class="text-xs">No sales data available</span>
      </div>
    } @else {
      @for (prod of productsList(); track prod._id; let i = $index) {
        <div class="relative h-8 flex items-center justify-between px-3 text-xs sm:text-sm">
          <!-- Progress Bar Background -->
          <div 
            class="absolute left-0 top-0 h-full rounded-md"
            [style.width]="prod.percentageWidth + '%'"
            [ngClass]="i === 0 ? 'bg-amber-100' : (i === 1 ? 'bg-zinc-200' : (i === 2 ? 'bg-orange-100/50' : 'bg-zinc-100'))"
          ></div>
          
          <!-- Text Content -->
          <div class="font-bold text-zinc-800 truncate relative z-10">
            {{ prod.name }} <span class="text-zinc-500 font-medium text-[11px]">({{ prod.price | currency:'EGP':'symbol':'1.0-0' }})</span>
          </div>
          
          <div class="font-bold text-zinc-800 relative z-10 shrink-0 ml-2 text-xs">
            {{ prod.sales | number }} Sales
          </div>
        </div>
      }
    }
  </div>
</div>
