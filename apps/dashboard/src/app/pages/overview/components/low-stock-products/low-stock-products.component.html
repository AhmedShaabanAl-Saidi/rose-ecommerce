<div class="rounded-2xl border border-zinc-200/80 bg-white p-6 shadow-sm flex flex-col h-full">
  <div class="mb-5">
    <h3 class="text-lg font-bold text-zinc-800">Low Stock Products</h3>
  </div>

  <div class="flex-1">
    @if (productsList().length === 0) {
      <div class="flex h-32 flex-col items-center justify-center text-zinc-400">
        <i class="pi pi-check-circle text-2xl mb-2 text-emerald-500"></i>
        <span class="text-xs">All products stock are normal</span>
      </div>
    } @else {
      <div class="space-y-4 max-h-[300px] overflow-y-auto pr-2 custom-scrollbar">
        @for (prod of productsList(); track prod._id) {
          <div class="flex items-center justify-between">
            <span class="text-sm text-zinc-700 truncate max-w-[200px] sm:max-w-[280px]">
              {{ prod.name }}
            </span>
            <span class="text-xs font-bold whitespace-nowrap ml-2" [ngClass]="isCritical(prod.stock) ? 'text-red-500' : 'text-zinc-500'">
              {{ prod.stock }} Products
            </span>
          </div>
        }
      </div>
    }
  </div>
</div>
