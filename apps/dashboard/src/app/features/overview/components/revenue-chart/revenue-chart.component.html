<div class="flex h-full min-w-0 flex-col rounded-xl border border-zinc-200/80 bg-white p-4 shadow-sm transition-colors dark:border-zinc-800 dark:bg-zinc-900 dark:shadow-none sm:rounded-2xl sm:p-6">
  <div class="mb-4 flex min-w-0 flex-col gap-3 sm:mb-6 sm:flex-row sm:items-center sm:justify-between">
    <div class="min-w-0">
      <h3 class="truncate text-base font-bold text-zinc-800 dark:text-zinc-100 sm:text-lg">{{ 'DASHBOARD.OVERVIEW.WIDGETS.REVENUE' | translate }}</h3>
    </div>

    <!-- Filters -->
    <div class="flex flex-wrap items-center gap-x-4 gap-y-2 self-start text-xs sm:self-auto">
      <button
        type="button"
        (click)="setFilter('monthly')"
        [class]="activeFilter() === 'monthly' ? 'font-bold text-rose-600 dark:text-soft-pink-200' : 'text-zinc-400 dark:text-zinc-500 font-medium'"
      >
        {{ 'DASHBOARD.OVERVIEW.WIDGETS.MONTHLY' | translate }}
      </button>
      <button
        type="button"
        (click)="setFilter('weekly')"
        [class]="activeFilter() === 'weekly' ? 'font-bold text-rose-600 dark:text-soft-pink-200' : 'text-zinc-400 dark:text-zinc-500 font-medium'"
      >
        {{ 'DASHBOARD.OVERVIEW.WIDGETS.LAST_WEEK' | translate }}
      </button>
    </div>
  </div>

  <div class="min-h-[220px] min-w-0 flex-1 w-full sm:min-h-[250px] lg:min-h-[280px]">
    @if (activeData().length === 0) {
      <div class="flex h-full min-h-[220px] flex-col items-center justify-center px-2 text-center text-zinc-400 dark:text-zinc-500 sm:min-h-[250px] lg:min-h-[280px]">
        <i class="pi pi-chart-line text-3xl mb-2"></i>
        <span class="text-xs">{{ 'DASHBOARD.OVERVIEW.WIDGETS.NO_REVENUE_DATA' | translate }}</span>
      </div>
    } @else {
      <p-chart type="line" [data]="chartData()" [options]="chartOptions()" class="block h-full min-w-0 w-full max-w-full" [style]="{'height': '100%', 'width': '100%'}"></p-chart>
    }
  </div>
</div>
