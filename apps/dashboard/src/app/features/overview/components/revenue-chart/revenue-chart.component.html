<div class="rounded-2xl border border-zinc-200/80 bg-white p-6 shadow-sm flex flex-col h-full">
  <div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h3 class="text-lg font-bold text-zinc-800">Revenue</h3>
    </div>

    <!-- Filters -->
    <div class="flex items-center gap-4 self-start sm:self-auto text-xs">
      <button
        type="button"
        (click)="setFilter('monthly')"
        [class]="activeFilter() === 'monthly' ? 'font-bold text-rose-600' : 'text-zinc-400 font-medium'"
      >
        Monthly
      </button>
      <button
        type="button"
        (click)="setFilter('weekly')"
        [class]="activeFilter() === 'weekly' ? 'font-bold text-rose-600' : 'text-zinc-400 font-medium'"
      >
        Last Week
      </button>
    </div>
  </div>

  <div class="flex-1 w-full h-[250px]">
    @if (activeData().length === 0) {
      <div class="flex h-full flex-col items-center justify-center text-zinc-400">
        <i class="pi pi-chart-line text-3xl mb-2"></i>
        <span class="text-xs">No revenue data</span>
      </div>
    } @else {
      <p-chart type="line" [data]="chartData()" [options]="chartOptions" class="w-full h-full block" [style]="{'height': '250px'}"></p-chart>
    }
  </div>
</div>
