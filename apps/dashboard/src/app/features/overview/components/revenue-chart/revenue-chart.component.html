<div class="flex h-full min-w-0 flex-col rounded-xl border border-zinc-200/80 bg-white p-4 shadow-sm transition-colors dark:border-zinc-800 dark:bg-zinc-900 dark:shadow-none sm:p-5">
  <div class="mb-4 flex min-w-0 flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div class="min-w-0">
      <h3 class="truncate text-base font-bold text-zinc-900 dark:text-zinc-100">
        {{ 'DASHBOARD.OVERVIEW.WIDGETS.REVENUE' | translate }}
      </h3>
      <p class="mt-1 truncate text-sm font-bold text-maroon-700 dark:text-soft-pink-200">
        EGP {{ activeTotal() | number:'1.0-0' }}
      </p>
    </div>

    <div class="inline-flex shrink-0 items-center rounded-lg border border-zinc-200 bg-zinc-50 p-1 text-xs dark:border-zinc-800 dark:bg-zinc-950/60">
      <button
        type="button"
        (click)="setFilter('monthly')"
        [attr.aria-pressed]="activeFilter() === 'monthly'"
        [ngClass]="activeFilter() === 'monthly' ? 'bg-white text-maroon-700 shadow-sm dark:bg-zinc-800 dark:text-soft-pink-200' : 'text-zinc-500 hover:text-zinc-800 dark:text-zinc-400 dark:hover:text-zinc-100'"
        class="rounded-md px-3 py-1.5 font-bold transition-colors"
      >
        {{ 'DASHBOARD.OVERVIEW.WIDGETS.MONTHLY' | translate }}
      </button>
      <button
        type="button"
        (click)="setFilter('weekly')"
        [attr.aria-pressed]="activeFilter() === 'weekly'"
        [ngClass]="activeFilter() === 'weekly' ? 'bg-white text-maroon-700 shadow-sm dark:bg-zinc-800 dark:text-soft-pink-200' : 'text-zinc-500 hover:text-zinc-800 dark:text-zinc-400 dark:hover:text-zinc-100'"
        class="rounded-md px-3 py-1.5 font-bold transition-colors"
      >
        {{ 'DASHBOARD.OVERVIEW.WIDGETS.LAST_WEEK' | translate }}
      </button>
    </div>
  </div>

  <div class="min-h-[250px] min-w-0 flex-1 w-full lg:min-h-[300px]">
    @if (activeData().length === 0) {
      <div class="flex h-full min-h-[250px] flex-col items-center justify-center px-2 text-center text-zinc-400 dark:text-zinc-500 lg:min-h-[300px]">
        <div class="mb-3 flex h-11 w-11 items-center justify-center rounded-xl bg-zinc-50 ring-1 ring-zinc-100 dark:bg-zinc-800/60 dark:ring-zinc-700">
          <i class="pi pi-chart-line text-xl"></i>
        </div>
        <span class="text-xs font-medium">{{ 'DASHBOARD.OVERVIEW.WIDGETS.NO_REVENUE_DATA' | translate }}</span>
      </div>
    } @else {
      <p-chart type="line" [data]="chartData()" [options]="chartOptions()" class="block h-full min-w-0 w-full max-w-full" [style]="{'height': '100%', 'width': '100%'}"></p-chart>
    }
  </div>
</div>
