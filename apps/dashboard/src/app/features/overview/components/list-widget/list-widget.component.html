<div
  class="flex h-full min-w-0 flex-col rounded-xl border border-zinc-200/80 bg-white p-4 shadow-sm transition-colors dark:border-zinc-800 dark:bg-zinc-900 dark:shadow-none sm:p-5">
  <div class="mb-4 flex min-w-0 items-center justify-between gap-3">
    <h3 class="truncate text-base font-bold text-zinc-900 dark:text-zinc-100">
      {{ title() }}
    </h3>

    @if (items().length > 0) {
    <span
      class="shrink-0 rounded-lg border border-zinc-200 bg-zinc-50 px-2.5 py-1 text-xs font-bold text-zinc-700 dark:border-zinc-800 dark:bg-zinc-950 dark:text-zinc-300">
      {{ totalValue() | i18nPlural: pluralMap() }}
    </span>
    }
  </div>

  <div class="custom-scrollbar max-h-[280px] min-w-0 flex-1 overflow-y-auto pe-1">
    @if (items().length === 0) {
    <div
      class="flex min-h-[220px] flex-col items-center justify-center px-2 text-center text-zinc-400 dark:text-zinc-500">
      <div
        class="mb-3 flex h-11 w-11 items-center justify-center rounded-xl bg-zinc-50 ring-1 ring-zinc-100 dark:bg-zinc-800/60 dark:ring-zinc-700">
        <i [class]="emptyIcon() + ' text-xl'"></i>
      </div>
      <span class="text-xs font-medium">{{ emptyMessage() | translate }}</span>
    </div>
    } @else {
    <ul class="m-0 list-none divide-y divide-zinc-100 p-0 dark:divide-zinc-800">
      @for (item of items(); track item.label) {
      <li
        class="flex min-w-0 items-center justify-between gap-3 px-1 py-3 transition-colors hover:bg-zinc-50/60 dark:hover:bg-zinc-800/50">
        <div class="flex min-w-0 items-center gap-3">
          <span class="h-2 w-2 shrink-0 rounded-full bg-maroon-500 dark:bg-soft-pink-300"></span>
          <span class="truncate text-sm font-semibold text-zinc-700 dark:text-zinc-300">{{ item.label }}</span>
        </div>
        <span
          class="shrink-0 whitespace-nowrap rounded-lg bg-zinc-100 px-2.5 py-1 text-xs font-bold text-zinc-700 dark:bg-zinc-800 dark:text-zinc-200">
          {{ item.value | i18nPlural: pluralMap() }}
        </span>
      </li>
      }
    </ul>
    }
  </div>
</div>
