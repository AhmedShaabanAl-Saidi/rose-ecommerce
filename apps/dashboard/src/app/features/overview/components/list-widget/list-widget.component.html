<div class="flex h-full min-w-0 flex-col rounded-xl border border-zinc-200/80 bg-white p-4 shadow-sm transition-colors dark:border-zinc-800 dark:bg-zinc-900 dark:shadow-none sm:rounded-2xl sm:p-6">
  <div class="mb-4 min-w-0">
    <h3 class="truncate text-base font-bold text-zinc-800 dark:text-zinc-100 sm:text-lg">{{ title() }}</h3>
  </div>

  <!-- Scrollable List -->
  <div class="custom-scrollbar max-h-[260px] min-w-0 flex-1 overflow-y-auto pe-1 sm:max-h-[320px]">
    @if (items().length === 0) {
      <div class="flex h-32 flex-col items-center justify-center px-2 text-center text-zinc-400 dark:text-zinc-500">
        <i [class]="emptyIcon() + ' text-2xl mb-2'"></i>
        <span class="text-xs">{{ emptyMessage() | translate }}</span>
      </div>
    } @else {
      <ul class="divide-y divide-zinc-100 p-0 m-0 list-none dark:divide-zinc-800">
        @for (item of items(); track item.label; let last = $last) {
          <li class="flex min-w-0 items-center justify-between gap-3 rounded-lg px-2 py-3 hover:bg-zinc-50/50 sm:py-3.5 transition-colors dark:hover:bg-zinc-800/60">
            <div class="flex min-w-0 items-center gap-3">
              <span class="truncate text-sm font-medium text-zinc-600 dark:text-zinc-300">{{ item.label }}</span>
            </div>
            <span class="shrink-0 whitespace-nowrap rounded-lg border border-zinc-100 bg-zinc-50/80 px-2.5 py-1 text-xs font-bold text-zinc-600 dark:border-zinc-800 dark:bg-zinc-950 dark:text-zinc-300">
              {{ item.value | i18nPlural: pluralMap() }}
            </span>
          </li>
        }
      </ul>
    }
  </div>
</div>
