<div class="rounded-2xl border border-zinc-200/80 bg-white p-6 shadow-sm flex flex-col h-full">
  <div class="mb-4">
    <h3 class="text-lg font-bold text-zinc-800">{{ title() }}</h3>
  </div>

  <!-- Scrollable List -->
  <div class="flex-1 overflow-y-auto pr-1 max-h-[320px] custom-scrollbar">
    @if (items().length === 0) {
      <div class="flex h-32 flex-col items-center justify-center text-zinc-400">
        <i [class]="emptyIcon() + ' text-2xl mb-2'"></i>
        <span class="text-xs">{{ emptyMessage() }}</span>
      </div>
    } @else {
      <ul class="divide-y divide-zinc-100 p-0 m-0 list-none">
        @for (item of items(); track item.label; let last = $last) {
          <li class="flex items-center justify-between py-3.5 hover:bg-zinc-50/50 rounded-lg px-2 transition-colors">
            <div class="flex items-center gap-3">
              <span class="text-sm font-medium text-zinc-600">{{ item.label }}</span>
            </div>
            <span class="rounded-lg border border-zinc-100 bg-zinc-50/80 px-2.5 py-1 text-xs font-bold text-zinc-600">
              {{ item.value | i18nPlural: pluralMap() }}
            </span>
          </li>
        }
      </ul>
    }
  </div>
</div>
