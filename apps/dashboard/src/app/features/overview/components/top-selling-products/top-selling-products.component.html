<div class="flex h-full min-w-0 flex-col rounded-xl border border-zinc-200/80 bg-white p-4 shadow-sm sm:rounded-2xl sm:p-6">
  <div class="mb-4 min-w-0 sm:mb-5">
    <h3 class="truncate text-base font-bold text-zinc-800 sm:text-lg">Top Selling Products</h3>
  </div>

  <div class="min-w-0 flex-1 space-y-3 sm:space-y-5">
    @if (productsList().length === 0) {
      <div class="flex h-32 flex-col items-center justify-center px-2 text-center text-zinc-400">
        <i class="pi pi-box text-2xl mb-2"></i>
        <span class="text-xs">No sales data available</span>
      </div>
    } @else {
      @for (prod of productsList(); track prod._id; let i = $index) {
        <div class="relative flex min-h-10 min-w-0 items-center justify-between gap-2 overflow-hidden rounded-md px-3 py-2 text-xs sm:min-h-8 sm:text-sm">
          <!-- Progress Bar Background -->
          <div 
            class="absolute inset-y-0 left-0 rounded-md"
            [style.width]="prod.percentageWidth + '%'"
            [ngClass]="i === 0 ? 'bg-amber-100' : (i === 1 ? 'bg-zinc-200' : (i === 2 ? 'bg-orange-100/50' : 'bg-zinc-100'))"
          ></div>
          
          <!-- Text Content -->
          <div class="relative z-10 min-w-0 flex-1 leading-tight">
            <div class="truncate font-bold text-zinc-800">{{ prod.name }}</div>
            <div class="truncate text-[11px] font-medium text-zinc-500">
              {{ prod.price | currency:'EGP':'symbol':'1.0-0' }}
            </div>
          </div>
          
          <div class="relative z-10 ml-2 shrink-0 whitespace-nowrap text-xs font-bold text-zinc-800">
            {{ prod.sales | number }} Sales
          </div>
        </div>
      }
    }
  </div>
</div>
