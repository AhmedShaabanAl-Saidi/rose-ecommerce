<div class="stat-card" [ngClass]="getCardClasses()">
  <span class="stat-card__accent" [ngClass]="getAccentClasses()"></span>

  <div class="stat-card__header">
    <div class="stat-card__icon" [ngClass]="getIconContainerClasses()">
      <i [class]="icon() + ' text-lg'"></i>
    </div>

    <p class="stat-card__label">
      {{ label() }}
    </p>
  </div>

  <div class="stat-card__body">
    <h3 class="stat-card__value" [ngClass]="getTextClasses()">
      {{ formatValue(value()) }}
    </h3>
  </div>
</div>
