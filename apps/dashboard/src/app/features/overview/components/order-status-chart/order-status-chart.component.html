<div class="flex h-full min-w-0 flex-col rounded-xl border border-zinc-200/80 bg-white p-4 shadow-sm sm:rounded-2xl sm:p-6">
  <div class="mb-4 min-w-0 sm:mb-6">
    <h3 class="truncate text-base font-bold text-zinc-800 sm:text-lg">Orders Status</h3>
  </div>

  <div class="relative flex min-w-0 flex-1 flex-col">
    @if (items().length === 0) {
      <div class="flex min-h-[220px] flex-col items-center justify-center px-2 text-center text-zinc-400 sm:min-h-[300px]">
        <i class="pi pi-chart-pie text-3xl mb-2"></i>
        <span class="text-xs">No orders data</span>
      </div>
    } @else {
      <div class="relative mb-4 flex h-[180px] min-w-0 w-full items-center justify-center sm:mb-6 sm:h-[200px]">
        <p-chart type="doughnut" [data]="chartData()" [options]="chartOptions" class="block h-full min-w-0 w-full max-w-full"></p-chart>
      </div>
      
      <!-- Custom Legend -->
      <div class="mt-auto space-y-3">
        @for (item of legendItems(); track item.label) {
          <div class="flex min-w-0 items-center justify-between gap-3 text-sm">
            <div class="flex min-w-0 items-center gap-2">
              <span class="h-2 w-2 shrink-0 rounded-full" [style.background-color]="item.color"></span>
              <span class="truncate font-medium text-zinc-600">{{ item.label }}</span>
            </div>
            <div class="shrink-0 whitespace-nowrap text-xs font-bold text-zinc-800">
              {{ item.count }} ({{ item.percentage }}%)
            </div>
          </div>
        }
      </div>
    }
  </div>
</div>
