<div id="admin-dashboard-container"
  class="w-full max-w-[calc(100vw-2rem)] min-w-0 space-y-5 overflow-x-hidden pb-24 sm:max-w-[calc(100vw-3rem)] sm:space-y-6 sm:pb-28 lg:max-w-none lg:pb-12">
  <div class="flex min-w-0 items-center justify-start gap-3 sm:justify-between sm:gap-4">
    <div class="min-w-0">
      <h1 id="dashboard-main-heading"
        class="truncate text-2xl font-bold tracking-normal text-zinc-950 dark:text-zinc-50 sm:text-3xl">
        {{ 'DASHBOARD.OVERVIEW.TITLE' | translate }}
      </h1>
    </div>

    <button type="button" (click)="refreshData()" [disabled]="loading()" aria-label="Refresh dashboard"
      class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-lg border border-zinc-200 bg-white text-zinc-600 shadow-sm transition-colors hover:border-maroon-200 hover:text-maroon-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-maroon-500 disabled:cursor-not-allowed disabled:opacity-60 dark:border-zinc-800 dark:bg-zinc-900 dark:text-zinc-300 dark:hover:border-soft-pink-300/40 dark:hover:text-soft-pink-200 dark:focus-visible:ring-soft-pink-300">
      <i class="pi pi-refresh text-sm" [class.pi-spin]="loading()"></i>
    </button>
  </div>

  @if (loading() && !statistics()) {
  <div class="space-y-4 sm:space-y-5">
    <div class="grid min-w-0 gap-4 sm:grid-cols-2 xl:grid-cols-4">
      @for (i of [1, 2, 3, 4]; track i) {
      <div
        class="min-h-[132px] animate-pulse rounded-xl border border-zinc-100 bg-white p-4 shadow-sm dark:border-zinc-800 dark:bg-zinc-900 sm:p-5">
        <div class="h-10 w-10 rounded-xl bg-zinc-100 dark:bg-zinc-800"></div>
        <div class="mt-7 h-6 w-24 rounded bg-zinc-100 dark:bg-zinc-800"></div>
        <div class="mt-3 h-4 w-32 rounded bg-zinc-100 dark:bg-zinc-800"></div>
      </div>
      }
    </div>
    <div class="grid min-w-0 gap-4 sm:gap-5 xl:grid-cols-3">
      <div
        class="h-72 animate-pulse rounded-xl border border-zinc-100 bg-white p-4 shadow-sm dark:border-zinc-800 dark:bg-zinc-900 sm:h-80 sm:p-5 xl:col-span-2">
      </div>
      <div
        class="h-72 animate-pulse rounded-xl border border-zinc-100 bg-white p-4 shadow-sm dark:border-zinc-800 dark:bg-zinc-900 sm:h-80 sm:p-5">
      </div>
    </div>
  </div>
  }

  @if (statistics(); as data) {
  <div class="min-w-0 space-y-4 sm:space-y-5">
    <div class="grid min-w-0 gap-4 sm:gap-5 xl:grid-cols-3">
      <div class="grid min-w-0 gap-4 sm:grid-cols-2 xl:col-span-2">
        <app-stat-card [label]="'DASHBOARD.OVERVIEW.STATS.TOTAL_PRODUCTS' | translate"
          [value]="data.overall.totalProducts" icon="pi pi-box" colorType="rose"
          id="stat-total-products"></app-stat-card>

        <app-stat-card [label]="'DASHBOARD.OVERVIEW.STATS.TOTAL_ORDERS' | translate" [value]="data.overall.totalOrders"
          icon="pi pi-shopping-bag" colorType="blue" id="stat-total-orders"></app-stat-card>

        <app-stat-card [label]="'DASHBOARD.OVERVIEW.STATS.TOTAL_CATEGORIES' | translate"
          [value]="data.overall.totalCategories" icon="pi pi-clipboard" colorType="purple"
          id="stat-total-categories"></app-stat-card>

        <app-stat-card [label]="'DASHBOARD.OVERVIEW.STATS.TOTAL_REVENUE' | translate"
          [value]="data.overall.totalRevenue" icon="pi pi-dollar" colorType="green"
          id="stat-total-revenue"></app-stat-card>
      </div>

      <div class="h-full min-w-0">
        <app-list-widget [title]="'DASHBOARD.OVERVIEW.WIDGETS.ALL_CATEGORIES' | translate"
          [items]="categoryWidgetItems()" [emptyMessage]="
              'DASHBOARD.OVERVIEW.WIDGETS.NO_CATEGORY_DATA' | translate
            " emptyIcon="pi pi-inbox" id="widget-all-categories"></app-list-widget>
      </div>
    </div>

    <div class="grid min-w-0 gap-4 sm:gap-5 xl:grid-cols-3">
      <div class="min-w-0">
        <app-order-status-chart [items]="data.orders.ordersByStatus" id="widget-order-status"></app-order-status-chart>
      </div>

      <div class="min-w-0 xl:col-span-2">
        <app-revenue-chart [dailyRevenue]="data.orders.dailyRevenue" [monthlyRevenue]="data.orders.monthlyRevenue"
          id="widget-revenue-trends"></app-revenue-chart>
      </div>
    </div>

    <div class="grid min-w-0 gap-4 sm:gap-5 xl:grid-cols-2">
      <div class="min-w-0">
        <app-top-selling-products [items]="data.products.topSellingProducts"
          id="widget-top-selling"></app-top-selling-products>
      </div>

      <div class="min-w-0">
        <app-low-stock-products [items]="data.products.lowStockProducts" id="widget-low-stock"></app-low-stock-products>
      </div>
    </div>
  </div>
  }

  @if (error() && !statistics()) {
  <div
    class="flex min-h-[360px] flex-col items-center justify-center rounded-xl border border-red-100 bg-white p-6 text-center shadow-sm dark:border-red-500/20 dark:bg-zinc-900 sm:p-8 lg:p-12">
    <div
      class="mb-4 flex h-12 w-12 items-center justify-center rounded-xl bg-red-50 text-red-600 ring-1 ring-red-100 dark:bg-red-500/10 dark:text-red-300 dark:ring-red-500/20">
      <i class="pi pi-exclamation-triangle text-xl"></i>
    </div>
    <h4 class="text-sm font-bold text-red-800 dark:text-red-200">
      {{ 'DASHBOARD.OVERVIEW.ERRORS.FAILED_LOAD_STATISTICS' | translate }}
    </h4>
    <p class="mt-1 max-w-full break-words text-xs text-red-600 dark:text-red-300 sm:max-w-md">
      {{ error() | translate }}
    </p>
    <button type="button" (click)="refreshData()"
      class="mt-5 inline-flex items-center gap-2 rounded-lg bg-red-600 px-4 py-2 text-xs font-bold text-white shadow-sm transition-colors hover:bg-red-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-500 dark:bg-red-500 dark:hover:bg-red-400">
      <i class="pi pi-refresh text-xs"></i>
      {{ 'DASHBOARD.OVERVIEW.ERRORS.TRY_AGAIN' | translate }}
    </button>
  </div>
  }
</div>
