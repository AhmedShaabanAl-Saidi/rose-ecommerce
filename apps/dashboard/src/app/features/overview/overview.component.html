<div
  id="admin-dashboard-container"
  class="min-w-0 space-y-4 pb-24 sm:space-y-5 sm:pb-28 lg:space-y-6 lg:pb-12"
>
  <!-- Welcome Header -->
  <div class="mb-4 sm:mb-6">
    <h1 id="dashboard-main-heading" class="text-sm font-medium text-zinc-500">
      Dashboard
    </h1>
  </div>

  <!-- Loading Skeleton Loader -->
  @if (loading() && !statistics()) {
    <div class="space-y-4 sm:space-y-5 xl:space-y-6">
      <div class="grid min-w-0 gap-4 sm:grid-cols-2 xl:grid-cols-4 xl:gap-6">
        @for (i of [1, 2, 3, 4]; track i) {
          <div class="h-28 animate-pulse rounded-xl border border-zinc-100 bg-white p-4 shadow-sm sm:h-32 sm:rounded-2xl sm:p-6"></div>
        }
      </div>
      <div class="grid min-w-0 gap-4 sm:gap-5 xl:grid-cols-3 xl:gap-6">
        <div class="h-64 animate-pulse rounded-xl border border-zinc-100 bg-white p-4 shadow-sm sm:h-80 sm:rounded-2xl sm:p-6 xl:col-span-2"></div>
        <div class="h-64 animate-pulse rounded-xl border border-zinc-100 bg-white p-4 shadow-sm sm:h-80 sm:rounded-2xl sm:p-6"></div>
      </div>
    </div>
  }

  <!-- Main Statistics Grid -->
  @if (statistics(); as data) {
    <div class="min-w-0 space-y-4 sm:space-y-5 xl:space-y-6">
      <!-- Row 1: Stats Cards Grid + Category Widget -->
      <div class="grid min-w-0 gap-4 sm:gap-5 xl:grid-cols-3 xl:gap-6">
        <!-- Left Side: 2x2 Metric Cards Grid -->
        <div class="grid min-w-0 gap-4 sm:grid-cols-2 xl:col-span-2">
          <app-stat-card
            label="Total Products"
            [value]="data.overall.totalProducts"
            icon="pi pi-box"
            colorType="rose"
            id="stat-total-products"
          ></app-stat-card>

          <app-stat-card
            label="Total Orders"
            [value]="data.overall.totalOrders"
            icon="pi pi-shopping-bag"
            colorType="blue"
            id="stat-total-orders"
          ></app-stat-card>

          <app-stat-card
            label="Total Categories"
            [value]="data.overall.totalCategories"
            icon="pi pi-clipboard"
            colorType="purple"
            id="stat-total-categories"
          ></app-stat-card>

          <app-stat-card
            label="Total Revenue"
            [value]="data.overall.totalRevenue"
            icon="pi pi-dollar"
            colorType="green"
            id="stat-total-revenue"
          ></app-stat-card>
        </div>

        <!-- Right Side: Scrollable Categories Widget -->
        <div class="h-full min-w-0">
          <app-list-widget
            title="All Categories"
            [items]="categoryWidgetItems()"
            emptyMessage="No category data"
            emptyIcon="pi pi-inbox"
            id="widget-all-categories"
          ></app-list-widget>
        </div>
      </div>

      <!-- Row 2: Donut Order Status + Line Revenue Chart -->
      <div class="grid min-w-0 gap-4 sm:gap-5 xl:grid-cols-3 xl:gap-6">
        <!-- Left: Order Status SVG Donut -->
        <div class="min-w-0">
          <app-order-status-chart
            [items]="data.orders.ordersByStatus"
            id="widget-order-status"
          ></app-order-status-chart>
        </div>

        <!-- Right: Interactive SVG Area Line Chart -->
        <div class="min-w-0 xl:col-span-2">
          <app-revenue-chart
            [dailyRevenue]="data.orders.dailyRevenue"
            [monthlyRevenue]="data.orders.monthlyRevenue"
            id="widget-revenue-trends"
          ></app-revenue-chart>
        </div>
      </div>

      <!-- Row 3: Top Selling List + Low Stock Alert Table -->
      <div class="grid min-w-0 gap-4 sm:gap-5 xl:grid-cols-2 xl:gap-6">
        <!-- Left: Top Selling Products progress bar list -->
        <div class="min-w-0">
          <app-top-selling-products
            [items]="data.products.topSellingProducts"
            id="widget-top-selling"
          ></app-top-selling-products>
        </div>

        <!-- Right: Low Stock Alert warehouse status -->
        <div class="min-w-0">
          <app-low-stock-products
            [items]="data.products.lowStockProducts"
            id="widget-low-stock"
          ></app-low-stock-products>
        </div>
      </div>
    </div>
  }

  <!-- Error Fallback Message -->
  @if (error() && !statistics()) {
    <div class="flex flex-col items-center justify-center rounded-xl border border-red-100 bg-red-50/50 p-6 text-center shadow-sm sm:rounded-2xl sm:p-8 lg:p-12">
      <div class="flex h-12 w-12 items-center justify-center rounded-full bg-red-100 text-red-600 mb-4">
        <i class="pi pi-exclamation-triangle text-xl"></i>
      </div>
      <h4 class="text-sm font-bold text-red-800">Failed to load statistics</h4>
      <p class="mt-1 max-w-full break-words text-xs text-red-600 sm:max-w-md">{{ error() }}</p>
      <button
        type="button"
        (click)="refreshData()"
        class="mt-4 rounded-lg bg-red-600 px-4 py-2 text-xs font-bold text-white hover:bg-red-700 transition-colors shadow-sm"
      >
        Try Again
      </button>
    </div>
  }
</div>
