<app-dashboard-data-table 
  [config]="config" 
  [data]="products()"
  (deleteItem)="openDeleteModal($any($event))"
></app-dashboard-data-table>

<app-delete-modal
  [visible]="isDeleteModalVisible()"
  [message]="'Are you sure you want to delete this product?'"
  (confirm)="confirmDelete()"
  (cancel)="closeDeleteModal()"
></app-delete-modal>
