<app-dashboard-data-table 
  [config]="config" 
  [data]="categories()"
  (deleteItem)="openDeleteModal($any($event))"
></app-dashboard-data-table>

<app-delete-modal
  [visible]="isDeleteModalVisible()"
  [message]="'DASHBOARD.PAGES.CATEGORIES.DELETE_CONFIRM'"
  (confirm)="confirmDelete()"
  (cancel)="closeDeleteModal()"
></app-delete-modal>
