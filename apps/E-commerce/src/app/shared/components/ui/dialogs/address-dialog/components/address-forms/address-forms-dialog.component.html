<div class="p-6 dark:bg-transparent">
  <h2 class="text-[30px] font-bold mb-6 text-start text-zinc-800">
    {{
      isEdit()
        ? ('ADDRESS_DIALOG.EDIT_TITLE' | translate)
        : ('ADDRESS_DIALOG.CREATE_TITLE' | translate)
    }}
  </h2>

  <div class="relative flex items-center mb-2 w-full h-10">
    <div
      class="absolute top-1/2 start-0 w-full h-1 bg-zinc-200 dark:bg-zinc-700 -translate-y-1/2 rounded-full"
    ></div>

    <div
      class="absolute top-1/2 start-0 h-1 bg-maroon-700 -translate-y-1/2 transition-all duration-500 rounded-full"
      [style.width]="steps() === 1 ? '50%' : '100%'"
    ></div>

    <div class="relative w-full flex">
      <div
        class="absolute start-1/2 rtl:start-[48%] -translate-x-1/2 top-1/2 -translate-y-1/2 z-10"
      >
        <div
          class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-base shadow-sm transition-all duration-500"
          [class]="
            steps() >= 1
              ? 'bg-maroon-700 text-white shadow-maroon-200'
              : 'bg-zinc-200 text-zinc-500 dark:bg-zinc-600 dark:text-zinc-300'
          "
        >
          1
        </div>
      </div>

      <div class="absolute end-0 top-1/2 -translate-y-1/2 z-10">
        <div
          class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-base shadow-sm transition-all duration-500"
          [class]="
            steps() === 2
              ? 'bg-maroon-700 text-white shadow-maroon-200'
              : 'bg-zinc-200 text-zinc-500 dark:bg-zinc-600 dark:text-zinc-300'
          "
        >
          2
        </div>
      </div>
    </div>
  </div>

  <app-address-form-step
    [hidden]="steps() !== 1"
    [form]="addressForm"
    (next)="onNext()"
  ></app-address-form-step>

  <app-address-map-step
    [hidden]="steps() !== 2"
    [center]="center"
    [zoom]="zoom"
    [markerPosition]="markerPosition"
    [markerOptions]="markerOptions"
    [isEdit]="isEdit()"
    [isRtl]="isRtl()"
    (back)="steps.set(1)"
    (mapClicked)="onMapClick($event)"
    (findLocation)="getCurrentLocation()"
    (submitted)="onSubmit()"
  ></app-address-map-step>
</div>
