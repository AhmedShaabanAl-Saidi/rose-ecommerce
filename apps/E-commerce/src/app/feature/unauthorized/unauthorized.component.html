<section
  class="relative min-h-[80vh] flex flex-col items-center justify-center px-6 py-24 bg-white"
  aria-labelledby="unauthorized-heading"
>
  <div class="relative z-10 flex flex-col items-center text-center max-w-lg">
    <!-- Shield Graphic -->
    <div class="mb-10 select-none" aria-hidden="true">
      <svg width="180" height="180" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Shield Outlines -->
        <path d="M12 23C12 23 3 19 3 7L12 2L21 7C21 19 12 23 12 23Z" stroke="#404040" stroke-width="1.5" stroke-linejoin="round" fill="#52525b"/>
        <!-- Shield Right Half (Darker) -->
        <path d="M12 23C12 23 21 19 21 7L12 2V23Z" fill="#3f3f46"/>
        <!-- Lock Shackle -->
        <path d="M9.5 10V7.5C9.5 6.11929 10.6193 5 12 5C13.3807 5 14.5 6.11929 14.5 7.5V10" stroke="#f4f4f5" stroke-width="1.5" stroke-linecap="round"/>
        <!-- Lock Body -->
        <rect x="8" y="10" width="8" height="7" rx="1.5" fill="#f4f4f5"/>
        <!-- Keyhole -->
        <path d="M12 12.5V14.5" stroke="#3f3f46" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- Typography -->
    <h1
      id="unauthorized-heading"
      class="text-2xl sm:text-3xl font-bold tracking-tight text-black mb-3"
    >
      {{ 'UNAUTHORIZED.TITLE' | translate }}
    </h1>

    <p class="text-sm sm:text-base text-zinc-400 mb-10">
      {{ 'UNAUTHORIZED.DESCRIPTION' | translate }}
    </p>

    <!-- Buttons -->
    <div class="flex flex-wrap items-center justify-center gap-3">
      @if (user()?.role === 'admin') {
      <a
        routerLink="/dashboard"
        class="inline-flex items-center justify-center rounded-lg border border-zinc-200 bg-white px-6 py-2.5 text-sm font-semibold text-zinc-700 shadow-sm hover:bg-zinc-50 transition-colors"
      >
        {{ 'UNAUTHORIZED.BACK_TO_DASHBOARD' | translate }}
      </a>
      } @else {
      <a
        routerLink="/home"
        class="inline-flex items-center justify-center rounded-lg border border-zinc-200 bg-white px-6 py-2.5 text-sm font-semibold text-zinc-700 shadow-sm hover:bg-zinc-50 transition-colors"
      >
        {{ 'UNAUTHORIZED.BACK_TO_HOME' | translate }}
      </a>
      }
    </div>
  </div>
</section>
