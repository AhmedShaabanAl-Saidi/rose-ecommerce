<section class="space-y-6">
  <h3 class="text-2xl font-bold text-zinc-900 dark:text-white">
    Payment Method
  </h3>

  <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
    <!-- Cash on Delivery -->
    <div 
      (click)="selectMethod('cash')"
      class="group relative cursor-pointer overflow-hidden rounded-2xl border-2 p-8 transition-all duration-300"
      [ngClass]="{
        'border-maroon-600 bg-maroon-50/30 dark:border-maroon-400 dark:bg-maroon-900/10': selectedMethod() === 'cash',
        'border-zinc-100 bg-zinc-50/50 hover:border-zinc-200 dark:border-zinc-800 dark:bg-zinc-900/40': selectedMethod() !== 'cash'
      }"
    >
      <div class="flex flex-col items-center text-center">
        <div class="mb-5 flex h-20 w-20 items-center justify-center rounded-2xl transition-colors duration-300"
             [ngClass]="{
               'bg-maroon-600 text-white shadow-lg shadow-maroon-600/20': selectedMethod() === 'cash',
               'bg-white text-zinc-400 dark:bg-zinc-800 dark:text-zinc-500': selectedMethod() !== 'cash'
             }">
          <lucide-angular name="banknote" [size]="40"></lucide-angular>
        </div>
        <h4 class="text-xl font-bold text-zinc-900 dark:text-white">Cash on Delivery</h4>
        <p class="mt-2 text-sm text-zinc-500 dark:text-zinc-400">Pay when your order is delivered to your doorstep.</p>
      </div>

      <!-- Selection Indicator -->
      @if (selectedMethod() === 'cash') {
        <div class="absolute right-4 top-4">
          <div class="flex h-6 w-6 items-center justify-center rounded-full bg-maroon-600 dark:bg-maroon-400">
            <lucide-angular name="check" [size]="14" class="text-white font-bold"></lucide-angular>
          </div>
        </div>
      }
    </div>

    <!-- Credit Card -->
    <div 
      (click)="selectMethod('card')"
      class="group relative cursor-pointer overflow-hidden rounded-2xl border-2 p-8 transition-all duration-300"
      [ngClass]="{
        'border-maroon-600 bg-maroon-50/30 dark:border-maroon-400 dark:bg-maroon-900/10': selectedMethod() === 'card',
        'border-zinc-100 bg-zinc-50/50 hover:border-zinc-200 dark:border-zinc-800 dark:bg-zinc-900/40': selectedMethod() !== 'card'
      }"
    >
      <div class="flex flex-col items-center text-center">
        <div class="mb-5 flex h-20 w-20 items-center justify-center rounded-2xl transition-colors duration-300"
             [ngClass]="{
               'bg-maroon-600 text-white shadow-lg shadow-maroon-600/20': selectedMethod() === 'card',
               'bg-white text-zinc-400 dark:bg-zinc-800 dark:text-zinc-500': selectedMethod() !== 'card'
             }">
          <lucide-angular name="credit-card" [size]="40"></lucide-angular>
        </div>
        <h4 class="text-xl font-bold text-zinc-900 dark:text-white">Credit Card</h4>
        <p class="mt-2 text-sm text-zinc-500 dark:text-zinc-400">Secure payment via Stripe. Fast and reliable.</p>
      </div>

      <!-- Selection Indicator -->
      @if (selectedMethod() === 'card') {
        <div class="absolute right-4 top-4">
          <div class="flex h-6 w-6 items-center justify-center rounded-full bg-maroon-600 dark:bg-maroon-400">
            <lucide-angular name="check" [size]="14" class="text-white font-bold"></lucide-angular>
          </div>
        </div>
      }
    </div>
  </div>
</section>
