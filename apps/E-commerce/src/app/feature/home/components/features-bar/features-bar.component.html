<section>
  <div
    class="grid grid-cols-1 gap-4 rounded-2xl border border-white/70 bg-[linear-gradient(135deg,rgba(251,234,234,0.96)_0%,rgba(255,241,245,0.98)_100%)] px-5 py-6 sm:grid-cols-2 sm:gap-x-6 sm:gap-y-[1.15rem] sm:px-7 sm:py-7 xl:grid-cols-4 xl:gap-5 xl:px-8 xl:py-[1.8rem] dark:border-white/5 dark:bg-[linear-gradient(135deg,rgba(50,33,39,0.98)_0%,rgba(39,26,31,0.98)_100%)]">
    @for (feature of features; track feature.title) {
    <article class="flex min-w-0 items-center gap-4 px-[0.45rem] py-[0.35rem] xl:px-1">
      <div
        class="flex h-16 w-16 shrink-0 items-center justify-center rounded-full bg-maroon-600 text-white dark:bg-soft-pink-300 dark:text-maroon-800"
        aria-hidden="true">
        <i [class]="feature.icon" class="text-[1.4rem]"></i>
      </div>

      <div class="min-w-0">
        <h3 class="m-0 text-[1.05rem] font-bold leading-[1.15] text-maroon-600 dark:text-soft-pink-200">
          {{ feature.title | translate }}
        </h3>
        <p class="mt-[0.3rem] text-[0.87rem] leading-[1.35] text-zinc-500 dark:text-zinc-300">
          {{ feature.subtitle | translate }}
        </p>
      </div>
    </article>
    }
  </div>
</section>
