<div
  class="grid grid-cols-12 gap-4 pb-5 border-b-2 border-zinc-100 last:border-0 last:pb-0"
>
  <div class="col-span-12 lg:col-span-2 lg:h-40 relative h-80 w-full">
    <img
      [ngSrc]="cartItem().product.imgCover"
      [alt]="cartItem().product.title"
      fill
      [priority]="isFirst()"
      style="object-fit: cover"
      class="rounded-xl"
    />
  </div>

  <div class="col-span-9 lg:col-span-7 flex flex-col justify-between py-1">
    <div>
      <h3 class="font-bold text-lg text-maroon-700">
        {{ cartItem().product.title }}
      </h3>
      <div class="flex items-center gap-1 mt-1">
        <lucide-icon
          name="star"
          class="text-orange-400 fill-amber-500"
        ></lucide-icon>
        <span
          >Rating:
          <span class="font-medium"
            >{{ cartItem().product.rateAvg }}/5</span
          ></span
        >
        <span class="text-blue-600 font-medium"
          >({{ cartItem().product.rateCount }} ratings)</span
        >
      </div>
    </div>

    <div class="flex items-baseline gap-1 mt-4">
      <span class="text-xs text-maroon-600 font-bold"
        >(x{{ cartItem().quantity }})</span
      >
      <span class="text-2xl font-bold text-zinc-800">{{
        cartItem().price
      }}</span>
      <span class="text-sm font-bold text-zinc-600 uppercase">EGP</span>
    </div>
  </div>

  <div class="col-span-3 lg:col-span-3 flex flex-col justify-between items-end">
    <lib-button
      (click)="removeProduct(cartItem().product._id)"
      [icon]="'trash-2'"
      [block]="true"
      [variant]="'destructive'"
      >Remove</lib-button
    >

    <div class="flex items-center gap-3">
      <lib-button
        [disabled]="cartItem().quantity <= 1"
        (click)="
          cartItem().quantity > 1 &&
            updateProductQuantity(
              cartItem().product._id,
              cartItem().quantity - 1
            )
        "
        [icon]="'minus'"
        [variant]="'secondary'"
      ></lib-button>

      <h5 class="border border-zinc-200 py-2 px-4 w-32 rounded-lg text-start">
        {{ cartItem().quantity }}
      </h5>

      <lib-button
        [disabled]="cartItem().quantity === cartItem().product.quantity"
        (click)="
          updateProductQuantity(cartItem().product._id, cartItem().quantity + 1)
        "
        [icon]="'plus'"
        [variant]="'secondary'"
      ></lib-button>
    </div>
  </div>
</div>
