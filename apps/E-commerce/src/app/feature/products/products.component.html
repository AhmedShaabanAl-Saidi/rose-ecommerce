<section class="grid grid-cols-1 gap-6 lg:grid-cols-4">
  <div class="min-w-0 lg:col-span-1">
    <app-filters (filterChange)="onFilterChange($event)"></app-filters>
  </div>
  <app-product-list class="min-w-0 lg:col-span-3" [categoryId]="appliedFilters().categoryId"
    [occasionId]="appliedFilters().occasionId" [rating]="appliedFilters().rating"
    [priceFrom]="appliedFilters().priceFrom" [priceTo]="appliedFilters().priceTo"></app-product-list>
</section>
