<div class="grid grid-cols-1 md:grid-cols-4 gap-6">
  <div class="col-span-1">
    <app-filters (filterChange)="onFilterChange($event)"></app-filters>
  </div>
  <app-product-list class="col-span-1 md:col-span-3" [categoryId]="selectedCategoryId()"
    [occasionId]="selectedOccasionId()" [rating]="selectedRating()" 
    [priceFrom]="selectedPriceFrom()" [priceTo]="selectedPriceTo()"></app-product-list>
</div>
