<section class="flex flex-col gap-4 pb-6 border-b border-zinc-100">
  <div class="flex items-center justify-between mb-1">
    <h3 class="text-[20px] font-semibold text-zinc-800 m-0">{{ 'Rating' | translate }}</h3>
    @if (selectedRating()) {
    <app-filter-reset-btn (reset)="onReset()"></app-filter-reset-btn>
    }
  </div>

  <div class="flex items-center gap-1.5" (mouseleave)="onStarMouseleave()">
    @for (star of stars; track star) {
    <button type="button"
      class="relative bg-transparent border-none p-0 cursor-pointer text-amber-500 hover:scale-110 transition-transform duration-100 ease-in-out flex items-center justify-center w-7 h-7"
      (mousemove)="onStarMousemove($event, star)" (click)="onStarClick($event, star)">
      <lucide-icon [img]="StarIcon" [size]="28" [strokeWidth]="1.5"
        class="shrink-0 absolute inset-0 text-amber-500 pointer-events-none"></lucide-icon>

      <lucide-icon [img]="StarIcon" [size]="28" [strokeWidth]="1.5"
        class="shrink-0 absolute inset-0 text-amber-500 fill-current pointer-events-none transition-all duration-75 ease-linear"
        [style.clip-path]="getClipPath(star)"></lucide-icon>
    </button>
    }
  </div>
</section>
