<section class="flex flex-col gap-4 pb-6 border-b border-zinc-100 dark:border-zinc-700">
  <div class="flex items-center justify-between mb-1">
    <h3 class="m-0 text-[20px] font-semibold text-zinc-800 dark:text-soft-pink-200">{{ 'Price' | translate }}</h3>
    @if (priceFrom() !== null || priceTo() !== null) {
    <app-filter-reset-btn (reset)="onReset()"></app-filter-reset-btn>
    }
  </div>

  <div class="flex items-center gap-3 w-full">
    <div class="flex flex-col gap-1.5 w-1/2">
      <label class="text-[14px] font-medium text-zinc-600 dark:text-zinc-300">{{ 'from' | translate }}</label>
      <input type="number" [ngModel]="priceFrom()" (ngModelChange)="onPriceFromInput($event)" (change)="onPriceChange()"
        placeholder="0" min="0"
        class="w-full rounded-lg border border-zinc-200 bg-transparent px-3 py-2 text-[14px] text-zinc-800 transition-colors placeholder:text-zinc-400 focus:outline-none focus:border-maroon-600 focus:ring-1 focus:ring-maroon-600 dark:border-zinc-700 dark:bg-zinc-900/70 dark:text-zinc-100 dark:placeholder:text-zinc-500 dark:focus:border-soft-pink-400 dark:focus:ring-soft-pink-400" />
    </div>

    <div class="flex flex-col gap-1.5 w-1/2">
      <label class="text-[14px] font-medium text-zinc-600 dark:text-zinc-300">{{ 'to' | translate }}</label>
      <input type="number" [ngModel]="priceTo()" (ngModelChange)="onPriceToInput($event)" (change)="onPriceChange()"
        placeholder="1000000" [min]="minimumPriceTo()"
        class="w-full rounded-lg border border-zinc-200 bg-transparent px-3 py-2 text-[14px] text-zinc-800 transition-colors placeholder:text-zinc-400 focus:outline-none focus:border-maroon-600 focus:ring-1 focus:ring-maroon-600 dark:border-zinc-700 dark:bg-zinc-900/70 dark:text-zinc-100 dark:placeholder:text-zinc-500 dark:focus:border-soft-pink-400 dark:focus:ring-soft-pink-400" />
    </div>
  </div>
</section>
