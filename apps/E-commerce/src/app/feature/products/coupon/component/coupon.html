<section>
  <div class="col-span-4">
    <div
      class="bg-white rounded-2xl border border-gray-200 p-5 space-y-6 shadow-sm"
    >
      <h3 class="text-lg font-semibold">Summary</h3>

      <!-- Coupon -->
      <div class="flex gap-2">
        <input
          type="text"
          [(ngModel)]="couponCode"
          placeholder="Coupon Code"
          class="flex-1 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:right-2 focus:ring-red-400"
        />

        <button
          (click)="applyCoupon()"
          class="bg-red-600 hover:bg-red-700 text-white px-4 rounded-lg text-sm font-medium"
        >
          Apply Coupon
        </button>
      </div>

      <!-- Empty state -->
      <div
        class="border rounded-xl h-32 flex items-center justify-center text-gray-400 text-sm"
      >
        No coupons applied
      </div>

      <!-- Prices -->
      <div class="space-y-2 text-sm">
        <div class="flex justify-between">
          <span>Subtotal</span>
          <span>{{ subtotal }} EGP</span>
        </div>

        <div class="flex justify-between text-green-600">
          <span>Discount</span>
          <span>-{{ discountAmount }} EGP</span>
        </div>

        <div class="flex justify-between font-semibold text-base">
          <span>Total</span>
          <span>{{ subtotal - discountAmount }} EGP</span>
        </div>
      </div>

      <!-- Checkout -->
      <button
        [disabled]="!isCouponValid"
        class="w-full mt-3 py-3 rounded-xl text-white font-semibold transition bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 disabled:bg-gray-300 disabled:cursor-not-allowed"
      >
        Checkout →
      </button>
    </div>
  </div>
</section>
