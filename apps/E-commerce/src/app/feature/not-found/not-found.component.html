<lib-not-found
  [title]="'NOT_FOUND.TITLE' | translate"
  [description]="'NOT_FOUND.DESCRIPTION' | translate"
>
  @if (user()?.role === 'admin') {
  <a
    routerLink="/dashboard"
    class="inline-flex items-center justify-center px-6 py-2.5 rounded-full border border-zinc-200 bg-white text-zinc-600 hover:bg-zinc-50 hover:text-zinc-900 transition-colors text-sm font-medium shadow-sm"
  >
    {{ 'NOT_FOUND.BACK_TO_DASHBOARD' | translate }}
  </a>
  } @else {
  <a
    routerLink="/home"
    class="inline-flex items-center justify-center px-6 py-2.5 rounded-full border border-zinc-200 bg-white text-zinc-600 hover:bg-zinc-50 hover:text-zinc-900 transition-colors text-sm font-medium shadow-sm"
  >
    {{ 'NOT_FOUND.BACK_TO_HOME' | translate }}
  </a>

  <a
    routerLink="/products"
    class="inline-flex items-center justify-center px-6 py-2.5 rounded-full bg-maroon-700 text-white hover:bg-maroon-800 transition-colors text-sm font-medium shadow-sm"
  >
    {{ 'NOT_FOUND.BROWSE_PRODUCTS' | translate }}
  </a>
  }
</lib-not-found>
