<nav class="flex items-center justify-center" aria-label="Checkout steps">
  <div class="flex w-full max-w-md items-center justify-between">
    @for (step of steps(); track $index; let i = $index) {
      <!-- Step indicator -->
      <div class="flex flex-col items-center">
        <div
          class="flex h-10 w-10 items-center justify-center rounded-full text-sm font-bold transition-all duration-300"
          [ngClass]="{
            'bg-[var(--color-btn-bg)] text-[var(--color-btn-text)] ring-4 ring-[var(--color-btn-bg)]/15': currentStep() > i + 1,
            'bg-[var(--color-btn-bg)] text-[var(--color-btn-text)] ring-4 ring-[var(--color-btn-bg)]/20 shadow-lg shadow-[var(--color-btn-bg)]/20': currentStep() === i + 1,
            'bg-zinc-200 text-zinc-500 dark:bg-zinc-800 dark:text-zinc-400': currentStep() < i + 1
          }"
          [attr.aria-current]="currentStep() === i + 1 ? 'step' : null"
        >
          @if (currentStep() > i + 1) {
            <lucide-angular name="check" [size]="20"></lucide-angular>
          } @else {
            {{ i + 1 }}
          }
        </div>
        <span
          class="mt-2 text-xs font-semibold uppercase tracking-wider transition-colors duration-300"
          [ngClass]="{
            'text-[var(--color-btn-bg)]': currentStep() >= i + 1,
            'text-zinc-400 dark:text-zinc-500': currentStep() < i + 1
          }"
        >
          {{ step.label }}
        </span>
      </div>

      <!-- Connector line (all except last step) -->
      @if ($index < steps().length - 1) {
        <div class="mx-4 h-0.5 flex-1 rounded-full bg-zinc-200 dark:bg-zinc-800 overflow-hidden">
          <div
            class="h-full rounded-full bg-[var(--color-btn-bg)] transition-all duration-500 ease-in-out"
            [style.width.%]="currentStep() > i + 1 ? 100 : 0"
          ></div>
        </div>
      }
    }
  </div>
</nav>
