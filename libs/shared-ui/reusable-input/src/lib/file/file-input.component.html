<div class="input-wrapper">
  @if (label()) {
  <label [for]="inputId()" class="input-label">
    {{ label() }} @if (required()) { <span class="text-red-500 ml-0.5">*</span> }
  </label>
  }

  <div
    (click)="fileInput.click()"
    class="relative w-full flex items-center justify-between border border-zinc-200 dark:border-zinc-700 rounded-xl bg-white dark:bg-zinc-800 p-2.5 px-4 cursor-pointer hover:border-maroon-700 dark:hover:border-soft-pink-400 transition-colors"
  >
    <span class="text-zinc-400 dark:text-zinc-500 text-sm truncate max-w-[70%]">
      {{ selectedLabel || placeholder() }}
    </span>

    <button
      type="button"
      class="flex items-center gap-1.5 text-maroon-700 hover:text-maroon-800 dark:text-soft-pink-300 dark:hover:text-soft-pink-400 font-semibold text-sm focus:outline-none cursor-pointer"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4.5 h-4.5 text-maroon-700 dark:text-soft-pink-300">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" />
      </svg>
      <span>{{ 'SHARED.UPLOAD_FILE' | translate }}</span>
    </button>

    <input
      #fileInput
      [id]="inputId()"
      type="file"
      [accept]="accept() || null"
      [multiple]="multiple()"
      [disabled]="isDisabled"
      [attr.aria-describedby]="describedBy"
      [attr.aria-invalid]="Invalid"
      (blur)="onTouched()"
      (change)="handleChange($event)"
      class="hidden"
    />
  </div>

  <lib-input-error [control]="control" [errorId]="errorId()"></lib-input-error>
</div>
